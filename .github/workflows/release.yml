name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  SIV3D_VERSION: 0.6.16
  SIV3D_SDK_SHA256: 5819af501b3589d5bdd8052a97688af19a854c6a0af7d7f5bc70ae2a1975fcdd

jobs:
  build:
    name: build
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git lfs pull --exclude "tools/**"

      - id: siv3d-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/OpenSiv3D_SDK_${{ env.SIV3D_VERSION }}
          key: opensiv3d-sdk-${{ env.SIV3D_SDK_SHA256 }}
      - if: steps.siv3d-cache.outputs.cache-hit != 'true'
        run: |
          $zip = "$env:RUNNER_TEMP/OpenSiv3D_SDK.zip"
          Invoke-WebRequest "https://siv3d.jp/downloads/Siv3D/manual/$env:SIV3D_VERSION/OpenSiv3D_SDK_$env:SIV3D_VERSION.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:SIV3D_SDK_SHA256) { throw "Siv3D SDK のハッシュが一致しない" }
          7z x $zip "-o$env:RUNNER_TEMP" -y

      - name: Build
        run: |
          Set-Item "env:SIV3D_$($env:SIV3D_VERSION.Replace('.', '_'))" "$env:RUNNER_TEMP\OpenSiv3D_SDK_$env:SIV3D_VERSION"
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild ShoutWars.vcxproj -p:Configuration=Release -p:Platform=x64 -m -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 素材はすべて exe に埋め込まれるので、添えるのは README とライセンスだけ
      - id: package
        name: Package
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $dir = 'dist/ShoutWars'
          New-Item -ItemType Directory "$dir/licenses" -Force | Out-Null
          Copy-Item App/ShoutWars.exe, README.md, LICENSE, CREDITS.ini $dir
          Copy-Item licenses/* "$dir/licenses"
          Compress-Archive $dir "dist/ShoutWars-$name-win64.zip"
          '{ "exhibition": true }' | Set-Content "$dir/config.json"
          Compress-Archive $dir "dist/ShoutWars-$name-win64-exhibition.zip"
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/ShoutWars/ShoutWars.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ShoutWars-${{ steps.package.outputs.name }}
          path: dist/*.zip

      - if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --draft --title "$GITHUB_REF_NAME" --generate-notes
